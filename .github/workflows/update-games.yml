name: Update game list

on:
  schedule:
    - cron: '0 21 * * *'   # 毎日 6:00 JST に実行
  workflow_dispatch:        # 手動実行も可能
    inputs:
      inspect:
        description: 'ランキングページの構造だけを調べる（games.jsonは更新しない）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 生存判定・セルラン付与のロジックをネットワーク無しで検証してから走らせる
      # （照合を壊すとサ終タイトルが消えない／稼働中タイトルが消えるので先に落とす）
      - name: Test updater logic
        run: python tests/test_games.py

      - name: Inspect ranking pages
        if: ${{ inputs.inspect }}
        run: GAMES_INSPECT=1 python scripts/update_games.py

      - name: Generate games.json
        if: ${{ !inputs.inspect }}
        run: python scripts/update_games.py

      # 自動削除はしない方針なので、消えたものではなく
      # 「要確認として印を付けたもの」を通知する。
      - name: Report suspects
        if: ${{ !inputs.inspect }}
        run: |
          python - <<'EOF'
          import json
          d = json.load(open('data/games.json', encoding='utf-8'))
          print(f"プレイ中 {len(d['playing'])}本 / 人気 {len(d.get('trending', []))}本")
          ranked = sum(1 for g in d['playing'] if g.get('rank'))
          print(f"セルラン掲載 {ranked}本")
          for g in d['playing']:
              if g.get('sunsetting'):
                  print(f"::warning::要確認（App Storeで未検出）: {g['label']} — {g.get('reason','')}")
          EOF

      - name: Commit & push (with rebase retry)
        if: ${{ !inputs.inspect }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/games.json
          if git diff --cached --quiet; then
            echo 'No changes in games.json'
            exit 0
          fi
          git commit -m 'chore: update games.json (auto)'
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
            sleep 5
          done
          exit 1
